version: 1
interface:
  display_name: Hubtel Software Development
  short_description: Grounds engineering answers in Hubtel Dev Docs, gates package installs, and applies code-quality guidelines via @hubtel/engineering-mcp tools in Hubtel projects.
  default_prompt: I'm working in a Hubtel project. Use the Hubtel Engineering MCP. The two catalog tools return only an index, never content — so never stop after a catalog call: always follow it, in the same turn, with the matching content call before answering or editing code. To ground any Hubtel-specific answer, call get_docs_catalog (pass a natural-language query) and then get_doc on the top ids, citing each doc's dev-docs URL. Call audit_packages (batched) before any npm/NuGet install or manifest edit and halt on any package where isTrusted=false, isVulnerable=true, or isSafeVersion=false. Before authoring or editing any code, determine the domain (package.json present ⇒ frontend, else backend), call get_guidelines_catalog for that domain (it returns a flat list of {domain, scope, name, description}), then get_guideline (batched) for general (always), logging (only for logging code), and any other applicable scope, and conform the code to that fetched guidance — not to the catalog descriptions.
