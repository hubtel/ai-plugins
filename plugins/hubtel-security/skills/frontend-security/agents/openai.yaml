version: 1
interface:
  display_name: Hubtel Frontend Security
  short_description: Move Next.js/Nuxt frontends to a BFF session model — audit, decide, and fix sign-in, sessions, origin checks, CSP, unauthenticated routes, and hardcoded secrets.
  default_prompt: Audit this frontend's session handling against the BFF session invariants (tokens in browser storage, client-side auth headers, Turnstile/OTP, renewal, sign-out, origin checks, CORS, CSP, framing, unauthenticated server routes, BFF path exposure, hardcoded credentials). Write the facts sheet and findings, work out the decisions with me, propose the staged plan, and wait for my approval before changing anything.
