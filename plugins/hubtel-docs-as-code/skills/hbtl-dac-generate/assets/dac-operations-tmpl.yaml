    required: false

  - name: LOG_LEVELS
    description: Log levels used (DEBUG, INFO, WARN, ERROR)
    required: true

  - name: LOG_PATTERNS
    description: Important log patterns to search for
    required: true
    example: "- `ERROR: Database connection failed` - Database unavailable\n- `WARN: Rate limit exceeded` - Too many requests"

  - name: LOG_LOCATION
    description: Where logs are stored/accessed
    required: true

  - name: METRICS
    description: Key metrics being tracked
    required: true

  - name: DASHBOARDS
    description: Links to monitoring dashboards
    required: false

  - name: ALERT_THRESHOLDS
    description: When alerts are triggered
    required: true

  - name: RUNBOOK_PROCEDURES
    description: Step-by-step procedures for on-call engineers
    required: true

  - name: COMMON_ISSUES
    description: Frequently encountered problems and their solutions
    required: true

  - name: ESCALATION_PATH
    description: Who to contact for different types of issues
    required: true

  - name: DEPLOYMENT_PROCESS
    description: How deployments are performed
    required: false

  - name: ROLLBACK_PROCEDURE
    description: How to roll back a failed deployment
    required: false
