placeholders:
  - name: PROJECT_NAME
    description: Name of the project
    required: true

  - name: EXPECTED_PERFORMANCE
    description: Normal performance metrics (response time, throughput, etc.)
    required: true

  - name: HEALTH_CHECKS
    description: Available health check endpoints
    required: true

  - name: RESOURCE_USAGE
    description: Expected CPU, memory, disk usage under normal load
    required: true

  - name: FAILURE_SCENARIOS
    description: Common ways the system can fail
    required: true

  - name: DEGRADED_OPERATION
